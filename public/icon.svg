<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#05070A" />
    </radialGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#004080" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#30A2FF" />
      <stop offset="100%" stop-color="#0055B3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base App Icon Background with smooth rounded corners (typical of iOS and Android Adaptive Icons) -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Outer Fine Technical Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#1E293B" stroke-width="3" />
  
  <!-- Outer glowing radar scale -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#glow-grad)" stroke-width="6" filter="url(#glow)" opacity="0.85" />

  <!-- Tick Marks representing compass/aviation dials (every 30 degrees) -->
  <g stroke="#38BDF8" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <line x1="256" y1="76" x2="256" y2="92" /> <!-- 12 o'clock -->
    <line x1="256" y1="420" x2="256" y2="436" /> <!-- 6 o'clock -->
    <line x1="76" y1="256" x2="92" y2="256" /> <!-- 9 o'clock -->
    <line x1="420" y1="256" x2="436" y2="256" /> <!-- 3 o'clock -->
    
    <!-- 45 Deg Diagonal Ticks (shorter) -->
    <line x1="128.7" y1="128.7" x2="140" y2="140" stroke-width="2.5" />
    <line x1="383.3" y1="128.7" x2="372" y2="140" stroke-width="2.5" />
    <line x1="128.7" y1="383.3" x2="140" y2="372" stroke-width="2.5" />
    <line x1="383.3" y1="383.3" x2="372" y2="372" stroke-width="2.5" />
  </g>

  <!-- Tactical Target Crosshair chevrons / radar center -->
  <path d="M 236 256 L 216 256 M 276 256 L 296 256 M 256 236 L 256 216 M 256 276 L 256 296" stroke="#0A84FF" stroke-width="3" stroke-linecap="round" opacity="0.5" />

  <!-- Radar Scanning Sweep Line -->
  <line x1="256" y1="256" x2="380" y2="160" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 256 256 L 380 160 A 140 140 0 0 0 256 116 Z" fill="url(#glow-grad)" opacity="0.15" />

  <!-- Center aviation chronograph display ring -->
  <circle cx="256" cy="256" r="120" fill="#070A0F" stroke="#0A84FF" stroke-width="1.5" filter="url(#soft-shadow)" />

  <!-- Inner core glowing center dot -->
  <circle cx="256" cy="256" r="10" fill="#38BDF8" filter="url(#glow)" />

  <!-- Sleek Jet Silhouette flying upwards through the center (Aviation Theme) -->
  <g transform="translate(256, 210) scale(0.95)" filter="url(#soft-shadow)">
    <path d="M 0,-45 
             L 4,-20 
             L 45,15 
             L 12,15 
             L 5,30 
             L 15,40 
             L -15,40 
             L -5,30 
             L -12,15 
             L -45,15 
             L -4,-20 
             Z" 
          fill="url(#accent-grad)" 
          stroke="#38BDF8" 
          stroke-width="2" 
          stroke-linejoin="round" />
  </g>

  <!-- Mini letters "A T C O" on the bottom curve -->
  <text x="256" y="480" fill="#64748B" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="900" letter-spacing="10" text-anchor="middle" opacity="0.8">ATCO</text>
</svg>
